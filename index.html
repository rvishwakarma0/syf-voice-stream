<!DOCTYPE html>
<html>
<head>
  <title>Voice Training with Real-time Feedback</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="app">
  <!-- MAIN CONTAINER WITH 80-20 SPLIT -->
  <div id="main-container">
    
    <!-- LEFT SIDE: CONVERSATION (80%) -->
    <div id="conversation-section">
      <!-- Call Header -->
      <div id="call-header">
        <div class="call-info">
          <span class="call-status-indicator" id="call-status" data-status="disconnected"></span>
          <span class="call-title">Live Call</span>
          <span class="call-timer" id="call-timer">-00:20</span>
        </div>
      </div>
      
      <!-- Main Content Area with iframe -->
      <div id="main-content">
        <!-- Iframe Container -->
        <div id="iframe-container">
          <iframe 
            id="call-iframe" 
            src="https://skote-h-rtl.react.themesbrand.com/login" 
            frameborder="0"
            allow="microphone; camera"
            title="Call Interface">
          </iframe>
        </div>
      </div>
    </div>
    
    <!-- RIGHT SIDE: FEEDBACK (20%) -->
    <div id="feedback-section">
      
      <!-- UPDATE INDICATOR -->
      <div id="update-badge" class="update-badge hidden">
        &#x1F504; NEW FEEDBACK
      </div>
      
      <!-- SENTIMENT ANALYSIS BOX -->
      <div id="sentiment-box" class="feedback-box">
        <div class="feedback-header">
          <span class="feedback-title">Sentiment</span>
        </div>
        <div id="sentiment-content" class="feedback-content">
          <p class="placeholder-text">Speak to get feedback...</p>
        </div>
      </div>
      
      <!-- SUGGESTION BOX -->
      <div id="suggestion-box" class="feedback-box">
        <div class="feedback-header">
          <span class="feedback-title">Call Quality Evaluation</span>
        </div>
        <div id="suggestion-content" class="feedback-content">
          <p class="placeholder-text">Waiting for your response...</p>
        </div>
      </div>
      
      <!-- SOP TO FOLLOW BOX -->
      <div id="sop-box" class="feedback-box" style="display: none;">
        <div class="feedback-header">
          <span class="feedback-title">SOP to Follow</span>
        </div>
        <div id="sop-content" class="feedback-content">
          <div style="white-space: pre-wrap;">&#x2705; Customer identity verification
&#x2705; Check payment due
&#x2705; Last activity for this account</div>
        </div>
      </div>
      
    </div>
    
  </div>
  
  <!-- Toast Container for Messages - Outside to avoid overflow issues -->
  <div id="toast-container"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
